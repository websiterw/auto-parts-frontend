<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto parts Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e17; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    #app { max-width: 1200px; width: 100%; background: #0f1624; border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    h1 { color: #FF6B00; font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #8a94a6; margin-bottom: 24px; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #1e2838; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: none; padding: 12px 24px; color: #8a94a6; font-size: 16px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #FF6B00; border-bottom-color: #FF6B00; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .card { background: #141c2b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #1e2838; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; }
    .card-title { font-size: 18px; font-weight: 600; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #b0baca; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #2a3040; background: #0a0e17; color: #fff; font-size: 15px; }
    .input-group input:focus { border-color: #FF6B00; outline: none; }
    .btn { background: #FF6B00; color: #fff; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn:hover { opacity: 0.85; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .btn-danger { background: #d32f2f; }
    .btn-success { background: #2e7d32; }
    .btn-outline { background: transparent; border: 1px solid #2a3040; color: #b0baca; }
    .btn-outline:hover { border-color: #FF6B00; color: #fff; }
    .login-container { max-width: 400px; margin: 60px auto; }
    .login-container .card { background: #141c2b; border: 1px solid #1e2838; }
    .login-container h1 { text-align: center; color: #FF6B00; }
    .login-container .subtitle { text-align: center; margin-bottom: 20px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; color: #8a94a6; font-weight: 600; border-bottom: 1px solid #1e2838; }
    td { padding: 10px 8px; border-bottom: 1px solid #1a2230; vertical-align: middle; }
    tr:hover td { background: #1a2230; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #1e4a2e; color: #4caf50; }
    .badge-danger { background: #4a1e1e; color: #f44336; }
    .badge-warning { background: #4a3a1e; color: #ff9800; }
    .badge-default { background: #2a3040; color: #b0baca; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.3s; }
    .modal { background: #141c2b; border-radius: 20px; padding: 24px; max-width: 500px; width: 92%; max-height: 90vh; overflow-y: auto; border: 1px solid #1e2838; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .modal h2 { margin-bottom: 16px; color: #FF6B00; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 600px) { #app { padding: 16px; } .tab-btn { padding: 10px 14px; font-size: 14px; } .card-header { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const API_BASE = isLocal
    ? 'http://localhost:5000/api'
    : 'https://auto-parts-backend-nh82.onrender.com/api';

  let adminToken = localStorage.getItem('adminToken');

  // ============================================================
  // AUTH FETCH
  // ============================================================
  async function authFetch(endpoint, options = {}) {
    const headers = {
      'Content-Type': 'application/json',
      'x-auth-token': adminToken,
      ...options.headers
    };
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || 'Request failed');
    return data;
  }

  // ============================================================
  // CLEAR STORAGE & RELOAD
  // ============================================================
  function clearStorageAndReload() {
    localStorage.clear();
    location.reload();
  }

  // ============================================================
  // LOGIN
  // ============================================================
  function renderLogin() {
    document.getElementById('app').innerHTML = `
      <div class="login-container">
        <h1>Admin Login</h1>
        <div class="card">
          <div class="input-group"><label>Username</label><input id="admin-user" type="text" value="admin"></div>
          <div class="input-group"><label>Password</label><input id="admin-pass" type="password" value="admin123"></div>
          <button class="btn" onclick="login()" style="width:100%;">Login</button>
          <button class="btn btn-outline" onclick="clearStorageAndReload()" style="margin-top:10px; width:100%;">
            <i class="fas fa-undo-alt"></i> Clear Storage & Reload
          </button>
        </div>
      </div>
    `;
  }

  async function login() {
    const username = document.getElementById('admin-user').value;
    const password = document.getElementById('admin-pass').value;
    try {
      const res = await fetch(`${API_BASE}/managers/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg);
      adminToken = data.token;
      localStorage.setItem('adminToken', adminToken);
      renderApp();
    } catch (err) {
      alert(err.message);
    }
  }

  // ============================================================
  // MAIN APP
  // ============================================================
  function renderApp() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div><h1>Admin Panel</h1><div class="subtitle">Manage your platform</div></div>
        <button class="btn btn-danger" onclick="logout()" style="width:auto;">Logout</button>
      </div>
      <div class="tabs" id="tab-headers">
        <button class="tab-btn active" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="transactions">Transactions</button>
        <button class="tab-btn" data-tab="withdrawals">Withdrawals</button>
        <button class="tab-btn" data-tab="recharges">Recharges</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>
      <div id="tab-content">
        <div class="tab-pane active" id="pane-users">Loading users...</div>
        <div class="tab-pane" id="pane-transactions">Loading transactions...</div>
        <div class="tab-pane" id="pane-withdrawals">Loading withdrawals...</div>
        <div class="tab-pane" id="pane-recharges">Loading recharges...</div>
        <div class="tab-pane" id="pane-settings">Loading settings...</div>
      </div>
    `;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.getElementById(`pane-${tab}`).classList.add('active');
        if (tab === 'users') loadUsers();
        else if (tab === 'transactions') loadTransactions();
        else if (tab === 'withdrawals') loadWithdrawals();
        else if (tab === 'recharges') loadRecharges();
        else if (tab === 'settings') loadSettings();
      });
    });

    loadUsers();
  }

  // ============================================================
  // USERS TAB
// ============================================================
// ============================================================
// USERS TAB – with working Edit & Delete
// ============================================================
let allUsers = [];
let userEditId = null;

// -------- Render functions --------
function renderUsers(users) {
  const tableBody = document.getElementById('user-table-body');
  if (!tableBody) return;
  tableBody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.accountNumber || 'N/A'}</strong></td>
      <td>${u.myReferralCode || '-'}</td>
      <td>RWF ${(u.balance !== undefined && u.balance !== null) ? u.balance.toFixed(2) : '0.00'}</td>
      <td>LV${u.level || 1}</td>
      <td>${u.checkinDays || 0}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editUser('${u._id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u._id}')">Delete</button>
      </td>
    </tr>
  `).join('');
}
  // Populate with all users after building
  filterUsers();
}

function filterUsers() {
  const input = document.getElementById('user-search');
  if (!input) return;
  const query = input.value.toLowerCase().trim();
  const filtered = query === '' ? allUsers : allUsers.filter(u => u.accountNumber.toLowerCase().includes(query));
  renderUsers(filtered);
  // update title count
  const title = document.querySelector('#pane-users .card-title');
  if (title) title.textContent = `All Users (${filtered.length})`;
}

async function loadUsers() {
  const container = document.getElementById('pane-users');
  try {
    const users = await authFetch('/managers/users');
    allUsers = users;
    renderUsersTable(users);
  } catch (err) {
    container.innerHTML = `<div class="card text-danger">Error loading users: ${err.message}</div>`;
  }
}

// -------- Edit User --------
async function editUser(id) {
  const user = allUsers.find(u => u._id === id);
  if (!user) return;
  userEditId = id;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <h2>Edit User</h2>
      <div class="input-group"><label>Account</label><input id="edit-account" value="${user.accountNumber}" disabled></div>
      <div class="input-group"><label>Balance (RWF)</label><input id="edit-balance" type="number" value="${user.balance}" step="0.01"></div>
      <div class="input-group"><label>Level</label><input id="edit-level" type="number" value="${user.level || 1}" min="1"></div>
      <div class="input-group"><label>Check-in Days</label><input id="edit-checkin" type="number" value="${user.checkinDays || 0}" min="0"></div>
      <div class="input-group"><label>New Password (leave blank to keep)</label><input id="edit-password" type="password" placeholder="Enter new password"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn" onclick="saveUserEdit()">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveUserEdit() {
  const modal = document.querySelector('.modal-overlay');
  const balance = parseFloat(document.getElementById('edit-balance').value);
  const level = parseInt(document.getElementById('edit-level').value);
  const checkinDays = parseInt(document.getElementById('edit-checkin').value);
  const password = document.getElementById('edit-password').value;
  const payload = { balance, level, checkinDays };
  if (password) payload.password = password;
  try {
    await authFetch(`/managers/users/${userEditId}`, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });
    alert('User updated successfully!');
    modal.remove();
    loadUsers();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

// -------- Delete User --------
async function deleteUser(id) {
  if (!confirm('Delete this user? This action is irreversible.')) return;
  try {
    await authFetch(`/managers/users/${id}`, { method: 'DELETE' });
    alert('User deleted.');
    loadUsers();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}
  // ============================================================
  // TRANSACTIONS TAB
  // ============================================================
  async function loadTransactions() {
    const container = document.getElementById('pane-transactions');
    try {
      const data = await authFetch('/managers/transactions');
      renderTransactions(data, container);
    } catch (err) {
      container.innerHTML = `<div class="card text-danger">Error loading transactions: ${err.message}</div>`;
    }
  }

  function renderTransactions(data, container) {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">Transactions (${data.length})</span>
          <button class="btn btn-danger" onclick="deleteAllTransactions()">Delete All</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
              ${data.map(tx => `
                <tr>
                  <td>${tx.userId?.accountNumber || 'N/A'}</td>
                  <td><span class="badge badge-default">${tx.type}</span></td>
                  <td>${tx.amount >= 0 ? '+' : ''}RWF ${Math.abs(tx.amount).toFixed(2)}</td>
                  <td><span class="badge ${tx.status === 'success' ? 'badge-success' : tx.status === 'pending' ? 'badge-warning' : 'badge-danger'}">${tx.status || 'success'}</span></td>
                  <td>${new Date(tx.createdAt).toLocaleString()}</td>
                  <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteTransaction('${tx._id}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function deleteTransaction(id) {
    if (!confirm('Delete this transaction?')) return;
    try {
      await authFetch(`/managers/transactions/${id}`, { method: 'DELETE' });
      alert('Deleted');
      loadTransactions();
    } catch (err) { alert(err.message); }
  }

  async function deleteAllTransactions() {
    if (!confirm('⚠️ Delete ALL transactions?')) return;
    try {
      const result = await authFetch('/managers/transactions/all', { method: 'DELETE' });
      alert(result.msg || 'All transactions deleted.');
      loadTransactions();
    } catch (err) { alert(err.message); }
  }

  // ============================================================
  // WITHDRAWALS TAB
  // ============================================================
  async function loadWithdrawals() {
    const container = document.getElementById('pane-withdrawals');
    try {
      const data = await authFetch('/managers/withdrawals/pending');
      renderPendingWithdrawals(data, container);
    } catch (err) {
      container.innerHTML = `<div class="card text-danger">Error loading withdrawals: ${err.message}</div>`;
    }
  }

  function renderPendingWithdrawals(data, container) {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">Pending Withdrawals (${data.length})</span>
          <button class="btn btn-danger" onclick="deleteAllWithdrawals()">Delete All</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Amount</th><th>Bank</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
              ${data.map(w => `
                <tr>
                  <td>${w.userId?.accountNumber || 'N/A'}</td>
                  <td>RWF ${w.amount}</td>
                  <td>${w.bankDetails?.bank || ''} - ${w.bankDetails?.accountNumber || ''}</td>
                  <td>${new Date(w.createdAt).toLocaleString()}</td>
                  <td>
                    <button class="btn btn-sm btn-success" onclick="approveWithdrawal('${w._id}')">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectWithdrawal('${w._id}')">Reject</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteWithdrawal('${w._id}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function approveWithdrawal(id) {
    if (!confirm('Approve?')) return;
    try { await authFetch(`/managers/withdrawals/${id}/approve`, { method: 'POST' }); alert('Approved'); loadWithdrawals(); } catch (err) { alert(err.message); }
  }
  async function rejectWithdrawal(id) {
    if (!confirm('Reject?')) return;
    try { await authFetch(`/managers/withdrawals/${id}/reject`, { method: 'POST' }); alert('Rejected'); loadWithdrawals(); } catch (err) { alert(err.message); }
  }
  async function deleteWithdrawal(id) {
    if (!confirm('Delete this withdrawal record?')) return;
    try { await authFetch(`/managers/withdrawals/${id}`, { method: 'DELETE' }); alert('Deleted'); loadWithdrawals(); } catch (err) { alert(err.message); }
  }
  async function deleteAllWithdrawals() {
    if (!confirm('⚠️ Delete ALL withdrawal records?')) return;
    try { const result = await authFetch('/managers/withdrawals/all', { method: 'DELETE' }); alert(result.msg || 'All withdrawal records deleted.'); loadWithdrawals(); } catch (err) { alert(err.message); }
  }

  // ============================================================
  // RECHARGES TAB
  // ============================================================
  async function loadRecharges() {
    const container = document.getElementById('pane-recharges');
    try {
      const data = await authFetch('/managers/recharges/pending');
      renderPendingRecharges(data, container);
    } catch (err) {
      container.innerHTML = `<div class="card text-danger">Error loading recharges: ${err.message}</div>`;
    }
  }

  function renderPendingRecharges(data, container) {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">Pending Recharges (${data.length})</span>
          <button class="btn btn-danger" onclick="deleteAllRecharges()">Delete All</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody>
              ${data.map(r => `
                <tr>
                  <td>${r.userId?.accountNumber || 'N/A'}</td>
                  <td>RWF ${r.amount}</td>
                  <td>${r.method}</td>
                  <td>${new Date(r.createdAt).toLocaleString()}</td>
                  <td>
                    <button class="btn btn-sm btn-success" onclick="approveRecharge('${r._id}')">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectRecharge('${r._id}')">Reject</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteRecharge('${r._id}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function approveRecharge(id) {
    if (!confirm('Approve?')) return;
    try { await authFetch(`/managers/recharges/${id}/approve`, { method: 'POST' }); alert('Approved'); loadRecharges(); } catch (err) { alert(err.message); }
  }
  async function rejectRecharge(id) {
    if (!confirm('Reject?')) return;
    try { await authFetch(`/managers/recharges/${id}/reject`, { method: 'POST' }); alert('Rejected'); loadRecharges(); } catch (err) { alert(err.message); }
  }
  async function deleteRecharge(id) {
    if (!confirm('Delete this recharge record?')) return;
    try { await authFetch(`/managers/recharges/${id}`, { method: 'DELETE' }); alert('Deleted'); loadRecharges(); } catch (err) { alert(err.message); }
  }
  async function deleteAllRecharges() {
    if (!confirm('⚠️ Delete ALL recharge records?')) return;
    try { const result = await authFetch('/managers/recharges/all', { method: 'DELETE' }); alert(result.msg || 'All recharge records deleted.'); loadRecharges(); } catch (err) { alert(err.message); }
  }

  // ============================================================
  // SETTINGS TAB – FIXED
  // ============================================================
  async function loadSettings() {
    const container = document.getElementById('pane-settings');
    try {
      const settings = await authFetch('/managers/settings');
      const giftCodes = await authFetch('/managers/giftcodes');
      renderSettings(settings, giftCodes, container);
    } catch (err) {
      console.error('Settings error:', err);
      container.innerHTML = `<div class="card text-danger">Error loading settings: ${err.message}</div>`;
    }
  }

  function renderSettings(settings, giftCodes, container) {
    container.innerHTML = `
      <!-- Platform Settings -->
      <div class="card">
        <h3>Platform Settings</h3>
        <div class="input-group">
          <label>MTN Account Number</label>
          <input type="text" id="mtn-account" value="${settings.mtnAccount || '0792702997'}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <div class="input-group">
          <label>MTN Account Name</label>
          <input type="text" id="mtn-name" value="${settings.mtnName || 'ARSENE BAYIRINGIRE'}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <div class="input-group">
          <label>Airtel Account Number</label>
          <input type="text" id="airtel-account" value="${settings.airtelAccount || '0737217328'}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <div class="input-group">
          <label>Airtel Account Name</label>
          <input type="text" id="airtel-name" value="${settings.airtelName || 'Arsene BAYIRINGIRE'}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <div class="input-group">
          <label>Minimum Withdrawal (RWF)</label>
          <input type="number" id="min-withdrawal" value="${settings.minWithdrawal || 3000}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <div class="input-group">
          <label>Withdrawal Fee (%)</label>
          <input type="number" id="withdrawal-fee" value="${settings.withdrawalFee || 20}" style="width:100%; padding:10px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
        </div>
        <button class="btn" onclick="saveSettings()">Save Settings</button>
      </div>

      <!-- Gift Codes -->
      <div class="card">
        <h3>Create Gift Code</h3>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
          <div style="flex:2; min-width:120px;">
            <label style="font-size:13px; color:#b0baca;">Code</label>
            <input type="text" id="gift-code" placeholder="e.g. bjjhgbnuj" style="width:100%; padding:8px; border-radius:8px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
          </div>
          <div style="flex:1; min-width:80px;">
            <label style="font-size:13px; color:#b0baca;">Min Amount (RWF)</label>
            <input type="number" id="gift-min" value="1000" style="width:100%; padding:8px; border-radius:8px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
          </div>
          <div style="flex:1; min-width:80px;">
            <label style="font-size:13px; color:#b0baca;">Max Amount (RWF)</label>
            <input type="number" id="gift-max" value="5000" style="width:100%; padding:8px; border-radius:8px; border:1px solid #2a3040; background:#0a0e17; color:#fff;">
          </div>
        </div>
        <button class="btn" onclick="createGiftCode()">Create Gift Code</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Existing Gift Codes (${giftCodes.length})</span>
          <button class="btn btn-danger" onclick="deleteAllGiftCodes()">Delete All</button>
        </div>
        ${giftCodes.length === 0 ? '<p style="color:#b0baca;">No gift codes created yet.</p>' : `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Code</th><th>Min</th><th>Max</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${giftCodes.map(g => `
                  <tr>
                    <td><strong>${g.code}</strong></td>
                    <td>RWF ${g.minAmount || 0}</td>
                    <td>RWF ${g.maxAmount || 0}</td>
                    <td><span class="badge ${g.isActive ? 'badge-success' : 'badge-danger'}">${g.isActive ? 'Active' : 'Used'}</span></td>
                    <td>
                      <button class="btn btn-sm btn-danger" onclick="deleteGiftCode('${g._id}')">Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>

      <!-- Change Admin Password -->
      <div class="card">
        <h3>Change Admin Password</h3>
        <div class="input-group"><label>Current Password</label><input id="admin-current-pwd" type="password"></div>
        <div class="input-group"><label>New Password</label><input id="admin-new-pwd" type="password"></div>
        <div class="input-group"><label>Confirm New Password</label><input id="admin-confirm-pwd" type="password"></div>
        <button class="btn" onclick="changeAdminPassword()">Update Password</button>
      </div>
    `;
  }

  // ============================================================
  // SETTINGS ACTIONS
  // ============================================================
  async function saveSettings() {
    const payload = {
      mtnAccount: document.getElementById('mtn-account').value,
      mtnName: document.getElementById('mtn-name').value,
      airtelAccount: document.getElementById('airtel-account').value,
      airtelName: document.getElementById('airtel-name').value,
      minWithdrawal: parseFloat(document.getElementById('min-withdrawal').value),
      withdrawalFee: parseFloat(document.getElementById('withdrawal-fee').value)
    };
    try {
      await authFetch('/managers/settings', { method: 'PUT', body: JSON.stringify(payload) });
      alert('Settings saved!');
    } catch (err) { alert(err.message); }
  }

  async function createGiftCode() {
    const code = document.getElementById('gift-code').value.trim();
    const minAmount = parseFloat(document.getElementById('gift-min').value);
    const maxAmount = parseFloat(document.getElementById('gift-max').value);
    if (!code || isNaN(minAmount) || isNaN(maxAmount) || minAmount > maxAmount) {
      alert('Please enter a valid code and amounts (min <= max).');
      return;
    }
    try {
      await authFetch('/managers/giftcodes', {
        method: 'POST',
        body: JSON.stringify({ code, minAmount, maxAmount })
      });
      alert('✅ Gift code created!');
      loadSettings();
    } catch (err) { alert('❌ Error: ' + err.message); }
  }

  async function deleteGiftCode(id) {
    if (!confirm('Delete this gift code?')) return;
    try {
      await authFetch(`/managers/giftcodes/${id}`, { method: 'DELETE' });
      alert('Deleted');
      loadSettings();
    } catch (err) { alert(err.message); }
  }

  async function deleteAllGiftCodes() {
    if (!confirm('⚠️ Delete ALL gift codes?')) return;
    try {
      const result = await authFetch('/managers/giftcodes/all', { method: 'DELETE' });
      alert(result.msg || 'All gift codes deleted.');
      loadSettings();
    } catch (err) { alert(err.message); }
  }

  async function changeAdminPassword() {
    const current = document.getElementById('admin-current-pwd').value;
    const newPwd = document.getElementById('admin-new-pwd').value;
    const confirm = document.getElementById('admin-confirm-pwd').value;
    if (!current || !newPwd || !confirm || newPwd !== confirm) {
      alert('Please fill all fields correctly.');
      return;
    }
    try {
      await authFetch('/managers/change-password', {
        method: 'POST',
        body: JSON.stringify({ currentPassword: current, newPassword: newPwd })
      });
      alert('Password updated!');
      document.getElementById('admin-current-pwd').value = '';
      document.getElementById('admin-new-pwd').value = '';
      document.getElementById('admin-confirm-pwd').value = '';
    } catch (err) { alert(err.message); }
  }

  // ============================================================
  // LOGOUT
  // ============================================================
  function logout() {
    localStorage.removeItem('adminToken');
    adminToken = null;
    renderLogin();
  }

  // ============================================================
  // INIT
  // ============================================================
  if (adminToken) {
    renderApp();
  } else {
    renderLogin();
  }
</script>
</body>
</html>
