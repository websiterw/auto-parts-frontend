<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto parts Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* (keep your existing styles – unchanged) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e17; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    #app { max-width: 1200px; width: 100%; background: #0f1624; border-radius: 24px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    h1 { color: #FF6B00; font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #8a94a6; margin-bottom: 24px; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #1e2838; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: none; padding: 12px 24px; color: #8a94a6; font-size: 16px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #FF6B00; border-bottom-color: #FF6B00; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .card { background: #141c2b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #1e2838; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; }
    .card-title { font-size: 18px; font-weight: 600; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #b0baca; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #2a3040; background: #0a0e17; color: #fff; font-size: 15px; }
    .input-group input:focus { border-color: #FF6B00; outline: none; }
    .btn { background: #FF6B00; color: #fff; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn:hover { opacity: 0.85; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }
    .btn-danger { background: #d32f2f; }
    .btn-success { background: #2e7d32; }
    .btn-outline { background: transparent; border: 1px solid #2a3040; color: #b0baca; }
    .btn-outline:hover { border-color: #FF6B00; color: #fff; }
    .login-container { max-width: 400px; margin: 60px auto; }
    .login-container .card { background: #141c2b; border: 1px solid #1e2838; }
    .login-container h1 { text-align: center; color: #FF6B00; }
    .login-container .subtitle { text-align: center; margin-bottom: 20px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; color: #8a94a6; font-weight: 600; border-bottom: 1px solid #1e2838; }
    td { padding: 10px 8px; border-bottom: 1px solid #1a2230; vertical-align: middle; }
    tr:hover td { background: #1a2230; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #1e4a2e; color: #4caf50; }
    .badge-danger { background: #4a1e1e; color: #f44336; }
    .badge-warning { background: #4a3a1e; color: #ff9800; }
    .badge-default { background: #2a3040; color: #b0baca; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.3s; }
    .modal { background: #141c2b; border-radius: 20px; padding: 24px; max-width: 500px; width: 92%; max-height: 90vh; overflow-y: auto; border: 1px solid #1e2838; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    .modal h2 { margin-bottom: 16px; color: #FF6B00; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 600px) { #app { padding: 16px; } .tab-btn { padding: 10px 14px; font-size: 14px; } .card-header { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const API_BASE = isLocal
    ? 'http://localhost:5000/api'
    : 'https://auto-parts-backend-nh82.onrender.com/api';

  let adminToken = localStorage.getItem('adminToken');

  // ============================================================
  // AUTH FETCH
  // ============================================================
  async function authFetch(endpoint, options = {}) {
    const headers = {
      'Content-Type': 'application/json',
      'x-auth-token': adminToken,
      ...options.headers
    };
    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || 'Request failed');
    return data;
  }

  // ============================================================
  // CLEAR STORAGE & RELOAD
  // ============================================================
  function clearStorageAndReload() {
    localStorage.clear();
    location.reload();
  }

  // ============================================================
  // LOGIN
  // ============================================================
  function renderLogin() {
    document.getElementById('app').innerHTML = `
      <div class="login-container">
        <h1>Admin Login</h1>
        <div class="card">
          <div class="input-group"><label>Username</label><input id="admin-user" type="text" value="admin"></div>
          <div class="input-group"><label>Password</label><input id="admin-pass" type="password" value="admin123"></div>
          <button class="btn" onclick="login()" style="width:100%;">Login</button>
          <button class="btn btn-outline" onclick="clearStorageAndReload()" style="margin-top:10px; width:100%;">
            <i class="fas fa-undo-alt"></i> Clear Storage & Reload
          </button>
        </div>
      </div>
    `;
  }

  async function login() {
    const username = document.getElementById('admin-user').value;
    const password = document.getElementById('admin-pass').value;
    try {
      const res = await fetch(`${API_BASE}/managers/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg);
      adminToken = data.token;
      localStorage.setItem('adminToken', adminToken);
      renderApp();
    } catch (err) {
      alert(err.message);
    }
  }

  // ============================================================
  // MAIN APP
  // ============================================================
  function renderApp() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div><h1>Admin Panel</h1><div class="subtitle">Manage your platform</div></div>
        <button class="btn btn-danger" onclick="logout()" style="width:auto;">Logout</button>
      </div>
      <div class="tabs" id="tab-headers">
        <button class="tab-btn active" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="transactions">Transactions</button>
        <button class="tab-btn" data-tab="withdrawals">Withdrawals</button>
        <button class="tab-btn" data-tab="recharges">Recharges</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>
      <div id="tab-content">
        <div class="tab-pane active" id="pane-users">Loading users...</div>
        <div class="tab-pane" id="pane-transactions">Loading transactions...</div>
        <div class="tab-pane" id="pane-withdrawals">Loading withdrawals...</div>
        <div class="tab-pane" id="pane-recharges">Loading recharges...</div>
        <div class="tab-pane" id="pane-settings">Loading settings...</div>
      </div>
    `;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.getElementById(`pane-${tab}`).classList.add('active');
        if (tab === 'users') loadUsers();
        else if (tab === 'transactions') loadTransactions();
        else if (tab === 'withdrawals') loadWithdrawals();
        else if (tab === 'recharges') loadRecharges();
        else if (tab === 'settings') loadSettings();
      });
    });

    loadUsers();
  }

  // ============================================================
  // USERS TAB – with working search
  // ============================================================
  let allUsers = [];
  let userEditId = null;

  async function loadUsers() {
    const container = document.getElementById('pane-users');
    try {
      const users = await authFetch('/managers/users');
      allUsers = users;
      renderUsersTable(users);
    } catch (err) {
      container.innerHTML = `<div class="card text-danger">Error loading users: ${err.message}</div>`;
    }
  }

  function renderUsersTable(users) {
    const container = document.getElementById('pane-users');
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">All Users (${users.length})</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="text" id="user-search" placeholder="Search by account..." oninput="filterUsers()" style="padding:8px 14px; border-radius:10px; border:1px solid #2a3040; background:#0a0e17; color:#fff; min-width:200px;">
            <button class="btn btn-sm btn-outline" onclick="document.getElementById('user-search').value=''; filterUsers();" style="padding:4px 12px;">Clear</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Account</th><th>Referral</th><th>Balance</th><th>Level</th><th>Check-in</th><th>Actions</th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td><strong>${u.accountNumber}</strong></td>
                  <td>${u.myReferralCode || '-'}</td>
                  <td>RWF ${u.balance.toFixed(2)}</td>
                  <td>LV${u.level || 1}</td>
                  <td>${u.checkinDays || 0}</td>
                  <td>
                    <button class="btn btn-sm btn-outline" onclick="editUser('${u._id}')">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteUser('${u._id}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  function filterUsers() {
    const q = document.getElementById('user-search').value.toLowerCase().trim();
    if (!q) {
      renderUsersTable(allUsers);
      return;
    }
    const filtered = allUsers.filter(u =>
      u.accountNumber.toLowerCase().includes(q) ||
      (u.myReferralCode && u.myReferralCode.toLowerCase().includes(q))
    );
    renderUsersTable(filtered);
  }

  // ... (editUser, saveUserEdit, deleteUser – unchanged, keep them from previous version)

  // ============================================================
  // TRANSACTIONS, WITHDRAWALS, RECHARGES, SETTINGS – unchanged
  // (copy from the previous working version)
  // ============================================================

  // For brevity, I'm not repeating all the other functions here – they are the same as in the previous file.
  // You can copy them from the previous admin.html I gave you.
  // Make sure to include:
  // - loadTransactions, renderTransactions, deleteTransaction, deleteAllTransactions
  // - loadWithdrawals, renderPendingWithdrawals, approveWithdrawal, rejectWithdrawal, deleteWithdrawal, deleteAllWithdrawals
  // - loadRecharges, renderPendingRecharges, approveRecharge, rejectRecharge, deleteRecharge, deleteAllRecharges
  // - loadSettings, renderSettings, saveSettings, createGiftCode, deleteGiftCode, deleteAllGiftCodes, changeAdminPassword

  // ============================================================
  // LOGOUT
  // ============================================================
  function logout() {
    localStorage.removeItem('adminToken');
    adminToken = null;
    renderLogin();
  }

  // ============================================================
  // INIT
  // ============================================================
  if (adminToken) {
    renderApp();
  } else {
    renderLogin();
  }
</script>
</body>
</html>
